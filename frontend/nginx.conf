server {
    listen 80;
    server_name localhost;

    # Maximum allowed payload size for file uploads (matches backend multer limit)
    client_max_body_size 10M;

    # Static build root
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Proxy API requests to backend container on Docker network
    location /api {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy uploads requests to backend container on Docker network
    location /uploads {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA routing fallback: send non-file requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
