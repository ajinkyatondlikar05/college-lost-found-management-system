services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: college-lost-found-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=5000
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - college_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: college-lost-found-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - college_network

  prometheus:
    image: prom/prometheus:latest
    container_name: college-lost-found-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - college_network

  grafana:
    image: grafana/grafana:latest
    container_name: college-lost-found-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - college_network

networks:
  college_network:
    driver: bridge

