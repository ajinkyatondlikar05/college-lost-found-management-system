services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: college-lost-found-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=5000
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - college_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: college-lost-found-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - college_network

networks:
  college_network:
    driver: bridge
